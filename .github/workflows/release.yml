name: Build and Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Build STLs and PNGs
        run: xvfb-run -a bash build.sh

      - name: Commit preview images to assets/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p assets
          cp output/images/*.png assets/
          git add assets/
          git diff --staged --quiet || git commit -m "Update preview images [skip ci]"
          git push

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "output/stl/*.stl,output/images/*.png"
          tag: latest
          name: Latest Build
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
